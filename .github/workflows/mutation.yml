name: Mutation testing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit:
    name: PIT sobre el núcleo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B test-compile pitest:mutationCoverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: informe-pit
          path: target/pit-reports/
