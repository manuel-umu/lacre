spring:
  application:
    name: lacre

  # Flyway migra como propietario y la aplicación se conecta como lacre_app, que solo puede leer e
  # insertar en registro_facturacion. Las dos credenciales las pone el despliegue; aquí solo va la
  # clave del rol restringido, que un callback de Flyway le asigna en cada arranque.
  flyway:
    placeholders:
      clave_rol_aplicacion: ${LACRE_DB_CLAVE_APLICACION:}

# La cookie de sesión de la consola no viaja en peticiones iniciadas desde otro sitio.
server:
  servlet:
    session:
      cookie:
        same-site: strict

# El identificador de correlación de cada petición, que pone FiltroDeCorrelacion.
logging:
  pattern:
    correlation: "[%X{correlacion:-}] "

lacre:
  # Credencial con la que el cliente llama a la API. UNA por despliegue: cada despliegue
  # sirve a un único sistema de facturación, que es la frontera de confianza.
  #
  # NUNCA se escribe aquí. Viene de una variable de entorno o de un fichero de secretos montado
  # en el contenedor, igual que las contraseñas de los PKCS#12. Sin ella lacre NO ARRANCA: una
  # API de facturación abierta deja el registro fiscal de sus obligados al alcance de cualquiera
  # que llegue al puerto.
  #
  #     openssl rand -base64 32
  api:
    clave: ${LACRE_API_CLAVE:}

  # Credencial de la consola de operación, en /consola. Sin clave la consola queda cerrada y
  # responde 404; lacre arranca igual. La clave, de al menos 16 caracteres, NUNCA se escribe aquí.
  #
  #     openssl rand -base64 24
  consola:
    usuario: ${LACRE_CONSOLA_USUARIO:lacre}
    clave: ${LACRE_CONSOLA_CLAVE:}

  # Identidad del sistema informático de facturación. Viaja en cada registro y debe coincidir
  # con la declaración responsable que firme quien comercializa el sistema.
  sistema-informatico:
    nombre-razon: ${LACRE_PRODUCTOR_NOMBRE:lacre}
    nif: ${LACRE_PRODUCTOR_NIF:89890001K}
    nombre-sistema-informatico: ${LACRE_SIF_NOMBRE:lacre}
    id-sistema-informatico: ${LACRE_SIF_ID:01}
    version: ${LACRE_SIF_VERSION:0.0.1}
    numero-instalacion: ${LACRE_SIF_INSTALACION:0001}

    # La zona horaria no está aquí: entra en el cálculo de la huella y es dato de cada obligado
    # tributario, no del despliegue. Canarias es Atlantic/Canary, no Europe/Madrid.

    # Un componente integrado en un sistema de facturación da servicio a varios obligados:
    # apartado 1.f) de la declaración responsable.
    multi-obligado: ${LACRE_MULTI_OBLIGADO:true}
    sirve-a-varios-obligados: ${LACRE_SIRVE_A_VARIOS:true}

  # URL base del servicio de cotejo que va DENTRO del código QR de cada factura. Producción es
  # https://www2.agenciatributaria.gob.es/wlpl/TIKE-CONT/ValidarQR? y pruebas
  # https://prewww2.aeat.es/wlpl/TIKE-CONT/ValidarQR?, y tiene que terminar en '?'.
  #
  # A diferencia del endpoint de remisión, esta NO tiene valor por defecto y sin ella lacre no
  # arranca. Un endpoint de remisión equivocado se nota: no se presenta nada. Un QR equivocado
  # sale impreso en cada factura y solo lo descubre quien lo escanea.
  qr:
    url-base: ${LACRE_QR_URL_BASE:}

  # Certificados con los que cada obligado se autentica ante la AEAT: un PKCS#12 por obligado,
  # nombrado con su NIF, en un volumen que monta quien despliega. Rotar uno es sustituir su
  # fichero. lacre NO guarda claves privadas ajenas en su base de datos.
  #
  # Un presentador.p12 opcional en el mismo directorio remite por los obligados que no tienen el
  # suyo: el certificado de quien despliega, si actúa como colaborador social o apoderado.
  #
  # Las contraseñas NUNCA se escriben aquí: vienen de variables de entorno o de un fichero de
  # secretos montado en el contenedor. La forma del mapa es
  # lacre.certificados.contrasenas.<NIF>, porque cada PKCS#12 trae la suya; la del presentador,
  # lacre.certificados.presentador.contrasena.
  certificados:
    directorio: ${LACRE_CERTIFICADOS_DIR:}

  # Remisión a la AEAT. El WSDL declara cuatro endpoints y elegir el que toca es decisión de
  # despliegue: www1 (producción), www10 (producción con certificado de sello), prewww1 (pruebas)
  # y prewww10 (pruebas con sello). Los de sello son OTRO HOST, no otra ruta: enviar un
  # certificado de sello al host que no toca falla en el TLS, antes de leer el mensaje.
  # El despachador saca los envíos pendientes y los remite a la AEAT. Activo por omisión: sin él,
  # lacre registra facturas y nunca las presenta. El periodo solo marca cada cuánto se mira; el
  # ritmo real lo impone el control de flujo del art. 16.2, de 60 segundos entre envíos.
  remision:
    despacho:
      activo: ${LACRE_DESPACHO_ACTIVO:true}
      periodo: ${LACRE_DESPACHO_PERIODO:10s}

  aeat:
    endpoint: ${LACRE_AEAT_ENDPOINT:https://prewww1.aeat.es/wlpl/TIKE-CONT/ws/SistemaFacturacion/VerifactuSOAP}
    timeout: ${LACRE_AEAT_TIMEOUT:60s}
