<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>lacre · no encontrado</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/logo.svg}">
    <style>
        :root {
            color-scheme: light dark;
            --fondo: #f5f4f1;
            --superficie: #ffffff;
            --texto: #1f1d1a;
            --tenue: #6b665f;
            --borde: #e4e0d8;
            --lacre: #a3242b;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fondo: #141312;
                --superficie: #1e1d1b;
                --texto: #ecebe8;
                --tenue: #a19d96;
                --borde: #33312d;
                --lacre: #e0676d;
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            box-sizing: border-box;
            font: 15px/1.5 system-ui, sans-serif;
            background: var(--fondo);
            color: var(--texto);
        }

        main {
            max-width: 420px;
            text-align: center;
        }

        .codigo {
            margin: 12px 0 0;
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--lacre);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        p {
            margin: 0;
            color: var(--tenue);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        nav a {
            padding: 6px 14px;
            border: 1px solid var(--borde);
            border-radius: 6px;
            background: var(--superficie);
            color: inherit;
            text-decoration: none;
        }

        nav a:hover,
        nav a:focus-visible {
            border-color: var(--lacre);
        }
    </style>
</head>
<body>
<main>
    <img th:src="@{/logo.svg}" alt="lacre" width="96" height="96">
    <p class="codigo">404</p>
    <h1>Aquí no hay nada sellado</h1>
    <p>La dirección no existe o ya no está disponible.</p>
    <nav>
        <a th:href="@{/consola}">Consola</a>
        <a th:href="@{/openapi.yaml}">Contrato de la API</a>
    </nav>
</main>
</body>
</html>
