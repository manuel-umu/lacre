# Clave de la API para los tests.
lacre.api.clave=clave-de-pruebas-de-lacre-no-es-un-secreto

# Entorno de pruebas del servicio de cotejo del QR.
lacre.qr.url-base=https://prewww2.aeat.es/wlpl/TIKE-CONT/ValidarQR?

# Clave del rol restringido lacre_app, que el callback de Flyway exige.
spring.flyway.placeholders.clave_rol_aplicacion=clave-de-pruebas-del-rol-de-aplicacion

# Sin despachador programado: un poller disparando entre tests los volvería intermitentes. Los
# tests que lo necesitan llaman a despachar() cuando toca.
lacre.remision.despacho.activo=false

# Credencial de la consola para los tests.
lacre.consola.usuario=operador
lacre.consola.clave=clave-de-pruebas-de-la-consola
