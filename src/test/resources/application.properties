# Clave de la API para los tests.
#
# Va en application.properties y no en un application.yaml de test A PROPOSITO: un
# src/test/resources/application.yaml ocultaria al de src/main/resources —mismo nombre, y el
# classpath de test va primero—, y con el se irian la identidad del sistema informatico y el
# endpoint de la AEAT. Con otra extension, Spring Boot carga los dos y este solo anade.
#
# No es un secreto: es de pruebas, y por eso esta escrita aqui en claro. La de un despliegue
# viene de LACRE_API_CLAVE.
lacre.api.clave=clave-de-pruebas-de-lacre-no-es-un-secreto
